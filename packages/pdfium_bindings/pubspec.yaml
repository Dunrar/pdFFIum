name: pdfium_bindings
description: This project aims to wrap the complete [Pdfium](https://pdfium.googlesource.com/pdfium/) API in dart, over FFI.
publish_to: 'none'
version: 2.0.2
homepage: https://gitea.donrar-server.duckdns.org/donrar/pdfium_bindings

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  ffi: ^2.1.2
  image: ^4.1.7
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.9
  ffigen: ^18.1.0 
  http: ^1.2.1
  lint: ^2.3.0

#dart run ffigen --config ffigen_pdfium.yaml